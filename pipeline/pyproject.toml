[project]
name = "apartments-pipeline"
version = "0.1.0"
description = "SQLMesh project that builds fit-ready rows from StreetEasy API records"
requires-python = ">=3.12"
dependencies = [
  "sqlmesh==0.236.3",
  "duckdb==1.5.5",
  "pyarrow>=19.0",
  "jsonpatch>=1.33,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
