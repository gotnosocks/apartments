# Format Python files with ruff's default style.
#
# Saved fits, datasets and reviews under data/ record the SHA-256 of the code
# that produced them, and their readers fail verification if that code changes.
# The files below are hashed by at least one saved artifact, so formatting
# must leave them byte-for-byte unchanged. Remove an entry once no retained
# artifact depends on it.
