[project]
name = "rentfrontier"
version = "0.1.0"
description = "Interpretable NYC asking-rent model built from scratch (GPU frontier line)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "pyarrow>=19.0",
  "jax>=0.7",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.7"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rentfrontier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
