[project]
name = "chelsea-apartments"
version = "0.1.0"
description = "Reproducible NYC rental-listing collection and analysis"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13",
  "duckdb>=1.2",
  "httpx>=0.28",
  "python-dotenv>=1.0",
  "typer>=0.15",
]

[project.optional-dependencies]
app = [
  "pandas>=2.2",
  "plotly>=6.0",
  "streamlit>=1.42",
]
dev = ["pytest>=8.0"]
model = [
    "arviz>=0.20",
    "h5netcdf>=1.6",
    "h5py>=3.12",
    "nutpie>=0.16",
    "pandas>=2.2",
    "pyarrow>=19.0",
    "pymc>=5.20",
]

[project.scripts]
apartments = "apartments.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apartments"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
