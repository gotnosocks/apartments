[project]
name = "chelsea-apartments"
version = "0.1.0"
description = "Reproducible NYC rental-listing collection and analysis"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13",
  "duckdb>=1.2",
  "jsonpatch>=1.33,<2",
  "httpx>=0.28",
  "python-dotenv>=1.0",
  "typer>=0.15",
  "Scrapy>=2.18",
  "parsel>=1.8",
  "Flask>=3.1,<4",
  "waitress>=3,<4",
  "requests>=2.32",
]

[project.optional-dependencies]
modal = ["modal==1.5.5"]
migration = ["modal==1.5.5", "zstandard>=0.23,<1"]
browser = ["selenium==4.48.0"]
dev = ["pytest>=8.0"]
model = [
    "arviz>=1.2",
    "h5netcdf>=1.6",
    "h5py>=3.12",
    "nutpie>=0.16.11",
    "pandas>=2.2",
    "pyarrow>=19.0",
    "plotly>=6.0",
    "pymc>=6.2",
    "scipy>=1.14",
    "threadpoolctl>=3.5",
    "matplotlib>=3.10,<4",
]

[project.scripts]
apartments = "apartments.cli:app"
streeteasy-archive = "streeteasy_archive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apartments", "src/streeteasy_archive", "models"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
