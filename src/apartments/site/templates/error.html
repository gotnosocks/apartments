{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<section class="card error">
  <h1>{{ {404: "Not found", 400: "Bad request", 503: "Not available yet"}.get(code, "Error") }}</h1>
  <p>{{ message }}</p>
  <p><a href="{{ url_for('index') }}">Back to the start page</a></p>
</section>
{% endblock %}
