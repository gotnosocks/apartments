<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 742" width="760" height="742" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#64748b"/>
    </marker>
    <marker id="arr-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#0f172a"/>
    </marker>
    <marker id="arr-new" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#e11d48"/>
    </marker>
    <style>
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 10; ry: 10; }
      .title { font-size: 14.5px; font-weight: 700; fill: #0f172a; letter-spacing: -0.01em; }
      .sub { font-size: 11px; fill: #475569; }
      .pill-txt { font-size: 10px; font-weight: 700; fill: #ffffff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tier-lbl { font-size: 9.2px; font-weight: 700; fill: #64748b; letter-spacing: 0.07em; text-transform: uppercase; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .tier-blue { font-size: 9.2px; font-weight: 700; fill: #2563eb; letter-spacing: 0.07em; text-transform: uppercase; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }

      .plate { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.25; rx: 8; ry: 8; }
      .plate-inner { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.1; rx: 7; ry: 7; }
      .plate-new { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.45; stroke-dasharray: 5 3; rx: 8; ry: 8; }
      .plate-obs { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; rx: 9; ry: 9; }

      .pidx { font-size: 9.5px; font-weight: 600; fill: #64748b; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; stroke-linejoin: round; }
      .pidx-w { font-size: 9.5px; font-weight: 600; fill: #64748b; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .pidx-r { font-size: 9.5px; font-weight: 600; fill: #64748b; text-anchor: end; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; stroke-linejoin: round; }
      .pidx-new { font-size: 9.5px; font-weight: 700; fill: #be123c; paint-order: stroke; stroke: #fff1f2; stroke-width: 4px; stroke-linejoin: round; }
      .pidx-new-r { font-size: 9.5px; font-weight: 700; fill: #be123c; text-anchor: end; paint-order: stroke; stroke: #fff1f2; stroke-width: 4px; stroke-linejoin: round; }
      .pidx-obs { font-size: 10px; font-weight: 700; fill: #2563eb; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }

      .node { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; }
      .node-new { fill: #ffffff; stroke: #e11d48; stroke-width: 1.75; stroke-dasharray: 4 2.5; }
      .node-obs { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.75; }
      .node-det { fill: #ffffff; stroke: #0f172a; stroke-width: 1.6; }
      .node-det-in { fill: none; stroke: #0f172a; stroke-width: 1.05; }

      .sym { font-family: Georgia, 'Times New Roman', serif; font-size: 13.5px; font-weight: 700; font-style: italic; fill: #0f172a; text-anchor: middle; }
      .sym-up { font-family: Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .sym-new { font-family: Georgia, 'Times New Roman', serif; font-size: 13.5px; font-weight: 700; font-style: italic; fill: #e11d48; text-anchor: middle; }
      .sym-up-new { font-family: Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: 700; fill: #e11d48; text-anchor: middle; }
      .sym-obs { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-weight: 700; font-style: italic; fill: #1d4ed8; text-anchor: middle; }

      .cap-b { font-size: 9.6px; font-weight: 700; fill: #0f172a; text-anchor: middle; paint-order: stroke; stroke-width: 3.8px; stroke-linejoin: round; }
      .cap-new { font-size: 9.6px; font-weight: 700; fill: #be123c; text-anchor: middle; paint-order: stroke; stroke-width: 3.8px; stroke-linejoin: round; }
      .cap-s { font-size: 8.8px; fill: #64748b; text-anchor: middle; paint-order: stroke; stroke-width: 3.8px; stroke-linejoin: round; }

      .hw { stroke: #ffffff; }
      .hp { stroke: #f8fafc; }
      .hn { stroke: #fff1f2; }

      .edge { fill: none; stroke: #64748b; stroke-width: 1.3; marker-end: url(#arr); }
      .edge-main { fill: none; stroke: #0f172a; stroke-width: 1.45; marker-end: url(#arr-main); }
      .edge-new { fill: none; stroke: #e11d48; stroke-width: 1.6; stroke-dasharray: 4 2.5; marker-end: url(#arr-new); }

      .eq-box { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; rx: 6; ry: 6; }
      .eq-hdr { font-size: 10.5px; font-weight: 700; fill: #0f172a; }
      .eq-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.3px; font-weight: 700; fill: #0f172a; }
      .eq-note { font-size: 10.2px; fill: #475569; }
      .leg-txt { font-size: 10.2px; fill: #475569; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="740" class="card-bg"/>
  <text x="18" y="30" class="title">Gen 3b — Building-Zones / Fit 8 (asof3_cap64) / Kitchen Sink (1 km)</text>
  <rect x="18" y="38" width="414" height="18" rx="9" fill="#2563eb"/>
  <text x="225.0" y="50" text-anchor="middle" class="pill-txt">Oct 20–24, 2026 · ELPD 148,234 → 156,105 · MAE 6.6% · Gate PASS</text>
  <text x="18" y="72" class="sub">Adds a smooth ~1 km neighborhood rent map for Manhattan &amp; Outer boroughs, a permanent building offset, and floor GP curves.</text>
  <text x="18" y="86" class="sub">Dashed crimson items are new vs Gen 3a (B0). Kitchen Sink expands x_i to ~250 as-of columns on this exact graph.</text>
  <g id="plates">
    <rect x="172" y="118" width="152" height="104" class="plate"/>
    <rect x="342" y="118" width="210" height="104" class="plate-new"/>
    <rect x="144" y="264" width="314" height="162" class="plate-new"/>
    <rect x="498" y="264" width="146" height="162" class="plate"/>
    <rect x="18" y="470" width="724" height="152" class="plate-obs"/>
  </g>
  <g id="edges">
    <path d="M 64 162 L 26 162 L 26 440 C 26 454, 244 446, 290 508" class="edge-new"/>
    <path d="M 248 222 L 248 232 C 248 240, 124 240, 124 264 L 124 438 C 124 474, 260 486, 298 510" class="edge"/>
    <path d="M 447 222 L 447 232 C 447 240, 308 236, 308 302" class="edge-new"/>
    <path d="M 308 388 L 314 504" class="edge-new"/>
    <path d="M 571 388 L 571 504" class="edge-main"/>
    <path d="M 118 530 L 290 530" class="edge-main"/>
    <path d="M 342 530 L 545 530" class="edge-main"/>
    <path d="M 664 530 L 597 530" class="edge"/>
  </g>
  <g id="tiers">
    <text x="18" y="108" class="tier-lbl">1. Citywide features, weekly market trend &amp; smooth neighborhood map</text>
    <text x="144" y="254" class="tier-lbl">2. Building memory (left) + listing noise scale (right)</text>
    <text x="18" y="460" class="tier-blue">3. Each observed NYC rental listing (no apartment plate yet)</text>
  </g>
  <g id="plate-labels">
    <text x="180" y="132" class="pidx">w = 1…W weeks</text>
    <text x="350" y="132" class="pidx-new">NEW · z ∈ {Manhattan, Outer}</text>
    <text x="154" y="417" class="pidx-new">NEW · b = 1…~68,000 NYC buildings</text>
    <text x="506" y="278" class="pidx">g = 0…3+ BR</text>
    <text x="30" y="612" class="pidx-obs">i = 1…~1.90M NYC rental listings (Fit 8 → Kitchen Sink expands x_i to ~250 as-of cols)</text>
  </g>
  <g id="nodes">
    <circle cx="84" cy="162" r="20" class="node-new"/>
    <text x="84" y="167" class="sym-up-new">β</text>
    <circle cx="248" cy="162" r="20" class="node"/>
    <text x="248" y="167" class="sym">L(w)</text>
    <circle cx="447" cy="162" r="20" class="node-new"/>
    <text x="447" y="167" class="sym-new">F<tspan dy="3" font-size="9">z</tspan></text>
    <circle cx="308" cy="324" r="20" class="node-new"/>
    <text x="308" y="329" class="sym-new">η<tspan dy="3" font-size="9">b</tspan></text>
    <circle cx="571" cy="324" r="20" class="node"/>
    <text x="571" y="329" class="sym">σ<tspan dy="3" font-size="9">g</tspan></text>
    <circle cx="94" cy="530" r="22" class="node-obs"/>
    <text x="94" y="535" class="sym-obs">x<tspan dy="3" font-size="9">i</tspan></text>
    <circle cx="316" cy="530" r="24" class="node-det"/>
    <circle cx="316" cy="530" r="19" class="node-det-in"/>
    <text x="316" y="535" class="sym">μ<tspan dy="3" font-size="9">i</tspan></text>
    <circle cx="571" cy="530" r="24" class="node-obs"/>
    <text x="571" y="535" class="sym-obs">y<tspan dy="3" font-size="9">i</tspan></text>
    <circle cx="684" cy="530" r="20" class="node"/>
    <text x="684" y="535" class="sym">λ<tspan dy="3" font-size="9">i</tspan></text>
  </g>
  <g id="captions">
    <text x="84" y="195" class="cap-new hw">Feature effects</text>
    <text x="84" y="206" class="cap-s hw">~120–250 as-of cols</text>
    <text x="84" y="217" class="cap-s hw">+ floor GP (cap 64)</text>
    <text x="248" y="195" class="cap-b hp">Citywide trend</text>
    <text x="248" y="206" class="cap-s hp">normal weekly RW</text>
    <text x="248" y="217" class="cap-s hp">+ seasonal waves</text>
    <text x="447" y="195" class="cap-new hn">Location map (HSGP)</text>
    <text x="447" y="206" class="cap-s hn">~1 km smooth 2D surface</text>
    <text x="447" y="217" class="cap-s hn">per borough zone</text>
    <text x="308" y="357" class="cap-new hn">Building level</text>
    <text x="308" y="368" class="cap-s hn">Gaussian offset around F_z</text>
    <text x="308" y="379" class="cap-s hn">permanent per building</text>
    <text x="571" y="357" class="cap-b hp">Base noise</text>
    <text x="571" y="368" class="cap-s hp">separate width per</text>
    <text x="571" y="379" class="cap-s hp">bedroom group</text>
    <text x="94" y="565" class="cap-b hw">Listing features</text>
    <text x="94" y="576" class="cap-s hw">as-of ad, unit-mean,</text>
    <text x="94" y="587" class="cap-s hw">building &amp; floor cols</text>
    <text x="316" y="567" class="cap-b hw">Expected log rent</text>
    <text x="316" y="578" class="cap-s hw">sum of 3 mean pieces</text>
    <text x="571" y="567" class="cap-b hw">Observed log rent</text>
    <text x="571" y="578" class="cap-s hw">log(net latest ask), Student-t(ν)</text>
    <text x="684" y="563" class="cap-b hw">Outlier weight</text>
    <text x="684" y="574" class="cap-s hw">learned ν ≈ 4.1 tails</text>
    <text x="684" y="585" class="cap-s hw">downweights outliers</text>
  </g>
  <g id="footer">
    <rect x="18" y="634" width="724" height="72" class="eq-box"/>
    <text x="30" y="651" class="eq-hdr">Exact prediction equation for listing i:</text>
    <text x="30" y="667" class="eq-code">log(net_ask_i) = [x_i·β] + L(week_i) + η_b + noise_i</text>
    <text x="30" y="683" class="eq-note">where η_b ~ Normal(F_z(loc_b), b_z²) centers each building on the 1 km HSGP neighborhood map F_z, and noise_i ~ Student-t(ν, σ_bed).</text>
    <text x="30" y="697" class="eq-note">Became the exact feature, spatial-map, and weekly-walk backbone inherited by all of Generation 4.</text>
    <circle cx="26" cy="723" r="5.5" class="node-obs"/>
    <text x="38" y="726" class="leg-txt">Observed data</text>
    <circle cx="136" cy="723" r="5.5" class="node"/>
    <text x="148" y="726" class="leg-txt">Learned latent parameter</text>
    <circle cx="298" cy="723" r="5.5" class="node-det"/>
    <circle cx="298" cy="723" r="3.2" class="node-det-in"/>
    <text x="310" y="726" class="leg-txt">Deterministic sum</text>
    <circle cx="428" cy="723" r="5.5" class="node-new"/>
    <text x="440" y="726" class="leg-txt" style="fill:#be123c;font-weight:600;">New in Gen 3b vs Gen 3a (B0)</text>
  </g>
</svg>
