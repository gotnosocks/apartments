<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#64748b"/>
    </marker>
    <marker id="arr-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#0f172a"/>
    </marker>
    <marker id="arr-new" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#e11d48"/>
    </marker>
    <style>
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 10; ry: 10; }
      .title { font-size: 14.5px; font-weight: 700; fill: #0f172a; letter-spacing: -0.01em; }
      .sub { font-size: 11px; fill: #475569; }
      .pill-txt { font-size: 10px; font-weight: 700; fill: #ffffff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tier-lbl { font-size: 9.2px; font-weight: 700; fill: #64748b; letter-spacing: 0.07em; text-transform: uppercase; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .tier-blue { font-size: 9.2px; font-weight: 700; fill: #2563eb; letter-spacing: 0.07em; text-transform: uppercase; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }

      .plate { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.25; rx: 8; ry: 8; }
      .plate-inner { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.1; rx: 7; ry: 7; }
      .plate-new { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.45; stroke-dasharray: 5 3; rx: 8; ry: 8; }
      .plate-obs { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; rx: 9; ry: 9; }

      .pidx { font-size: 9.5px; font-weight: 600; fill: #64748b; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; stroke-linejoin: round; }
      .pidx-w { font-size: 9.5px; font-weight: 600; fill: #64748b; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .pidx-r { font-size: 9.5px; font-weight: 600; fill: #64748b; text-anchor: end; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; stroke-linejoin: round; }
      .pidx-new { font-size: 9.5px; font-weight: 700; fill: #be123c; paint-order: stroke; stroke: #fff1f2; stroke-width: 4px; stroke-linejoin: round; }
      .pidx-new-r { font-size: 9.5px; font-weight: 700; fill: #be123c; text-anchor: end; paint-order: stroke; stroke: #fff1f2; stroke-width: 4px; stroke-linejoin: round; }
      .pidx-obs { font-size: 10px; font-weight: 700; fill: #2563eb; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }

      .node { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; }
      .node-new { fill: #ffffff; stroke: #e11d48; stroke-width: 1.75; stroke-dasharray: 4 2.5; }
      .node-obs { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.75; }
      .node-det { fill: #ffffff; stroke: #0f172a; stroke-width: 1.6; }
      .node-det-in { fill: none; stroke: #0f172a; stroke-width: 1.05; }

      .sym { font-family: Georgia, 'Times New Roman', serif; font-size: 13.5px; font-weight: 700; font-style: italic; fill: #0f172a; text-anchor: middle; }
      .sym-up { font-family: Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .sym-new { font-family: Georgia, 'Times New Roman', serif; font-size: 13.5px; font-weight: 700; font-style: italic; fill: #e11d48; text-anchor: middle; }
      .sym-up-new { font-family: Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: 700; fill: #e11d48; text-anchor: middle; }
      .sym-obs { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-weight: 700; font-style: italic; fill: #1d4ed8; text-anchor: middle; }

      .cap-b { font-size: 9.6px; font-weight: 700; fill: #0f172a; text-anchor: middle; paint-order: stroke; stroke-width: 3.8px; stroke-linejoin: round; }
      .cap-new { font-size: 9.6px; font-weight: 700; fill: #be123c; text-anchor: middle; paint-order: stroke; stroke-width: 3.8px; stroke-linejoin: round; }
      .cap-s { font-size: 8.8px; fill: #64748b; text-anchor: middle; paint-order: stroke; stroke-width: 3.8px; stroke-linejoin: round; }

      .hw { stroke: #ffffff; }
      .hp { stroke: #f8fafc; }
      .hn { stroke: #fff1f2; }

      .edge { fill: none; stroke: #64748b; stroke-width: 1.3; marker-end: url(#arr); }
      .edge-main { fill: none; stroke: #0f172a; stroke-width: 1.45; marker-end: url(#arr-main); }
      .edge-new { fill: none; stroke: #e11d48; stroke-width: 1.6; stroke-dasharray: 4 2.5; marker-end: url(#arr-new); }

      .eq-box { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; rx: 6; ry: 6; }
      .eq-hdr { font-size: 10.5px; font-weight: 700; fill: #0f172a; }
      .eq-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.3px; font-weight: 700; fill: #0f172a; }
      .eq-note { font-size: 10.2px; fill: #475569; }
      .leg-txt { font-size: 10.2px; fill: #475569; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="538" class="card-bg"/>
  <text x="18" y="30" class="title">Gen 3a — B0 Baseline (Clean NYC-Wide Start: No Location, Building, or Unit Terms)</text>
  <rect x="18" y="38" width="414" height="18" rx="9" fill="#2563eb"/>
  <text x="225.0" y="50" text-anchor="middle" class="pill-txt">Oct 18, 2026 · 1.90M NYC ads · Clean baseline on net latest ask</text>
  <text x="18" y="72" class="sub">Fresh NYC-wide start using net-effective latest ask. Deliberately omits spatial maps, buildings, and apartments.</text>
  <text x="18" y="86" class="sub">Two-tier graph: citywide weekly trend + bedroom-group noise feed directly into each observed listing.</text>
  <g id="plates">
    <rect x="186" y="118" width="240" height="104" class="plate-new"/>
    <rect x="472" y="118" width="174" height="104" class="plate-new"/>
    <rect x="18" y="268" width="724" height="152" class="plate-obs"/>
  </g>
  <g id="edges">
    <path d="M 92 216 L 92 234 C 92 246, 250 242, 286 306" class="edge"/>
    <path d="M 306 222 L 306 302" class="edge-new"/>
    <path d="M 559 222 L 559 302" class="edge-new"/>
    <path d="M 118 328 L 280 328" class="edge-main"/>
    <path d="M 332 328 L 533 328" class="edge-main"/>
    <path d="M 660 328 L 585 328" class="edge"/>
  </g>
  <g id="tiers">
    <text x="18" y="108" class="tier-lbl">1. Citywide features, weekly market trend &amp; bedroom-group noise scale</text>
    <text x="18" y="258" class="tier-blue">2. Each observed NYC rental listing (no building or unit plate)</text>
  </g>
  <g id="plate-labels">
    <text x="194" y="132" class="pidx-new">NEW · w = 1…W weeks (2014–2026)</text>
    <text x="480" y="132" class="pidx-new">NEW · g = 0, 1, 2, 3+ BR</text>
    <text x="30" y="410" class="pidx-obs">i = 1…~1.90M NYC-wide rental listings (net-effective latest ask)</text>
  </g>
  <g id="nodes">
    <circle cx="92" cy="162" r="20" class="node"/>
    <text x="92" y="167" class="sym-up">α, β</text>
    <circle cx="306" cy="162" r="20" class="node-new"/>
    <text x="306" y="167" class="sym-new">L(w)</text>
    <circle cx="559" cy="162" r="20" class="node-new"/>
    <text x="559" y="167" class="sym-new">σ<tspan dy="3" font-size="9">g</tspan></text>
    <circle cx="94" cy="328" r="22" class="node-obs"/>
    <text x="94" y="333" class="sym-obs">x<tspan dy="3" font-size="9">i</tspan></text>
    <circle cx="306" cy="328" r="24" class="node-det"/>
    <circle cx="306" cy="328" r="19" class="node-det-in"/>
    <text x="306" y="333" class="sym">μ<tspan dy="3" font-size="9">i</tspan></text>
    <circle cx="559" cy="328" r="24" class="node-obs"/>
    <text x="559" y="333" class="sym-obs">y<tspan dy="3" font-size="9">i</tspan></text>
    <circle cx="680" cy="328" r="20" class="node"/>
    <text x="680" y="333" class="sym">λ<tspan dy="3" font-size="9">i</tspan></text>
  </g>
  <g id="captions">
    <text x="92" y="195" class="cap-b hw">Feature effects</text>
    <text x="92" y="206" class="cap-s hw">beds, baths, flags</text>
    <text x="92" y="217" class="cap-s hw">+ 2 seasonal waves</text>
    <text x="306" y="195" class="cap-new hn">Citywide weekly trend</text>
    <text x="306" y="206" class="cap-s hn">damped local linear trend (LLT)</text>
    <text x="306" y="217" class="cap-s hn">Student-t slope shocks (ν_T)</text>
    <text x="559" y="195" class="cap-new hn">Base noise by beds</text>
    <text x="559" y="206" class="cap-s hn">separate error width</text>
    <text x="559" y="217" class="cap-s hn">for 0 / 1 / 2 / 3+BR</text>
    <text x="94" y="363" class="cap-b hw">Listing features</text>
    <text x="94" y="374" class="cap-s hw">beds, baths, flags</text>
    <text x="94" y="385" class="cap-s hw">(no location/unit)</text>
    <text x="306" y="365" class="cap-b hw">Expected log rent</text>
    <text x="306" y="376" class="cap-s hw">sum of α + x_i·β + L(w)</text>
    <text x="559" y="365" class="cap-b hw">Observed log rent</text>
    <text x="559" y="376" class="cap-s hw">log(net latest ask), Student-t(ν)</text>
    <text x="680" y="361" class="cap-b hw">Outlier weight</text>
    <text x="680" y="372" class="cap-s hw">learned ν ≈ 22 tails</text>
    <text x="680" y="383" class="cap-s hw">downweights wild asks</text>
  </g>
  <g id="footer">
    <rect x="18" y="432" width="724" height="72" class="eq-box"/>
    <text x="30" y="449" class="eq-hdr">Exact prediction equation for listing i:</text>
    <text x="30" y="465" class="eq-code">log(net_ask_i) = α + [x_i·β] + L(week_i) + noise_i</text>
    <text x="30" y="481" class="eq-note">where noise_i ~ Student-t(df=ν ≈ 22, scale=σ_bed) and L(w) is a damped local linear weekly trend.</text>
    <text x="30" y="495" class="eq-note">Purpose: establish a rock-solid, fast NYC-wide baseline before adding spatial, building, and apartment layers.</text>
    <circle cx="26" cy="521" r="5.5" class="node-obs"/>
    <text x="38" y="524" class="leg-txt">Observed data</text>
    <circle cx="136" cy="521" r="5.5" class="node"/>
    <text x="148" y="524" class="leg-txt">Learned latent parameter</text>
    <circle cx="298" cy="521" r="5.5" class="node-det"/>
    <circle cx="298" cy="521" r="3.2" class="node-det-in"/>
    <text x="310" y="524" class="leg-txt">Deterministic sum</text>
    <circle cx="428" cy="521" r="5.5" class="node-new"/>
    <text x="440" y="524" class="leg-txt" style="fill:#be123c;font-weight:600;">New B0 NYC-wide baseline structure</text>
  </g>
</svg>
